name: Deploy to EC2 with Compose

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/fastapi-ec2-demo:latest

      - name: Deploy to EC2 with Docker Compose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd fastapi-ec2-demo || exit 1

            # .env ファイルがなければ作成（初回のみ）
            if [ ! -f .env ]; then
              echo "POSTGRES_USER=postgres" >> .env
              echo "POSTGRES_PASSWORD=secret" >> .env
              echo "POSTGRES_DB=fastapi_db" >> .env
              echo "DATABASE_URL=postgresql://postgres:secret@db:5432/fastapi_db" >> .env
            fi

            docker compose down || true
            docker compose pull || true
            docker compose up -d --build